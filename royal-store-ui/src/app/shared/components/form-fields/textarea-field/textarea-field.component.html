<form [formGroup]="parentForm" class="mb-3 form-field">
  <p-floatlabel variant="on">
    <textarea
      [attr.id]="controlName"
      class="w-100"
      pTextarea
      [rows]="rows"
      [formControlName]="controlName"
      [invalid]="
        parentForm.controls[controlName].touched &&
        parentForm.controls[controlName].errors
      "
    ></textarea>
    <label [for]="controlName"
      >{{ label | translate }}

      @if (parentForm.controls[controlName].hasValidator(Validators.required)) {
        <i class="pi pi-asterisk required-icon"></i>
      }
    </label>
  </p-floatlabel>

  <app-form-error
    [parentForm]="parentForm"
    [controlName]="controlName"
  ></app-form-error>
</form>
