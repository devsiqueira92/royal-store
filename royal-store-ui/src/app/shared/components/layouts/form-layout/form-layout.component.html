<p-panel
  class="form-panel"
  [toggleable]="toggleable()"
  [collapsed]="collapsedPanel()"
>
  <ng-template #icons>
    <ng-content select="[icon-actions]"></ng-content>
  </ng-template>

  <ng-template #headericons let-collapsed>
    <i class="pi pi-angle-left" [class]="collapsed ? 'open' : 'closed'"></i>
  </ng-template>
  <ng-template #header>
    <div class="panel-header">
      <i class="pi" [class]="icon()"></i>
      <div class="panel-title">
        <h3>
          {{ title() | translate }}
        </h3>
        <span class="hint">
          {{ headerDetails() | translate }}
        </span>
      </div>
    </div>
  </ng-template>

  <ng-content></ng-content>
</p-panel>
