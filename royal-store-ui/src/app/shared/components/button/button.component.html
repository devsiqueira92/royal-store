<button
  class="w-100"
  pButton
  pRipple
  [attr.type]="type()"
  [loading]="loading()"
  [rounded]="rounded()"
  [icon]="icon()"
  [label]="label() | translate"
  [severity]="severity()"
  (click)="onClick.emit()"
  [disabled]="disabled()"
  [class]="severity()"
  [pTooltip]="tooltip() | translate"
  [text]="text()"
></button>
