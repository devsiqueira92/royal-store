<p-drawer
  #drawerRef
  [visible]="visible()"
  (visibleChange)="updateVisibility($event)"
  [modal]="isMobile()"
  [closeOnEscape]="false"
>
  <ng-template #headless>
    <div class="d-flex align-items-center p-3">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        width="36"
        height="36"
        fill="none"
      >
        <path
          d="M10 46L5 17L20 29L32 9L44 29L59 17L54 46H10Z"
          stroke="#86efac"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M10 53H54"
          stroke="#86efac"
          stroke-width="4"
          stroke-linecap="round"
        />
        <circle cx="5" cy="14" r="3" fill="#86efac" />
        <circle cx="32" cy="7" r="3" fill="#86efac" />
        <circle cx="59" cy="14" r="3" fill="#86efac" />
      </svg>

      <span id="logo-name" class="mx-2"> Axius Store</span>
    </div>
    <div class="overflow-y-auto">
      <p-panelmenu [model]="items" class="w-full md:w-80" />
    </div>
  </ng-template>
</p-drawer>
