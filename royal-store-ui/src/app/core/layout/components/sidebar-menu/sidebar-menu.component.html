<p-drawer
  #drawerRef
  [visible]="visible()"
  (visibleChange)="updateVisibility($event)"
  [modal]="isMobile()"
  [closeOnEscape]="false"
>
  <ng-template #headless>
    <div class="d-flex align-items-center p-3">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 100 100"
        width="40"
        height="40"
      >
        <path
          fill="#333333"
          d="M50,95 C20,80 5,55 5,30 L5,10 L95,10 L95,30 C95,55 80,80 50,95 Z M 50,65 C 55,65 60,60 60,53 C 60,46 55,42 50,42 C 45,42 40,46 40,53 C 40,60 45,65 50,65 Z M 35,40 C 38,40 40,37 40,33 C 40,30 38,27 35,27 C 32,27 30,30 30,33 C 30,37 32,40 35,40 Z M 50,35 C 53,35 55,32 55,28 C 55,25 53,22 50,22 C 47,22 45,25 45,28 C 45,32 47,35 50,35 Z M 65,40 C 68,40 70,37 70,33 C 70,30 68,27 65,27 C 62,27 60,30 60,33 C 60,37 62,40 65,40 Z"
        />
      </svg>

      <span id="logo-name" class="mx-2"> Royal Pet</span>
    </div>
    <div class="overflow-y-auto">
      <p-panelmenu [model]="items" class="w-full md:w-80" />
    </div>
  </ng-template>
</p-drawer>
