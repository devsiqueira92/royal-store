<section class="categories-page">
  <div class="categories-page__header">
    <h1 class="categories-page__title">{{ 'category.title' | translate }}</h1>
    <p class="categories-page__subtitle">
      {{ 'category.subtitle' | translate }}
    </p>
  </div>

  <div class="categories-page__layout">
    <div>
      <router-outlet></router-outlet>
    </div>

    @if (isLoading$ | async) {
      <p class="categories-page__status">
        {{ 'category.loading' | translate }}
      </p>
    } @else {
      <div class="categories-page__grid">
        @for (category of (categoryCards$ | async) ?? []; track category.id) {
          <app-category-card [category]="category" />
        } @empty {
          <p class="categories-page__empty">
            {{ 'category.empty' | translate }}
          </p>
        }
      </div>
    }
  </div>
</section>
