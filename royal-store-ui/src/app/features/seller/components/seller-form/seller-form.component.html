<form class="seller-form" [formGroup]="formGroup">
  <app-form-layout title="seller.form.section.details" [index]="1">
    @if (isCreateMode()) {
      <app-input-field
        controlName="firstName"
        [parentForm]="formGroup"
        label="seller.form.firstName"
        placeholder="seller.form.firstNamePlaceholder"
      ></app-input-field>

      <app-input-field
        controlName="lastName"
        [parentForm]="formGroup"
        label="seller.form.lastName"
        placeholder="seller.form.lastNamePlaceholder"
      ></app-input-field>
    } @else {
      <app-input-field
        controlName="fullName"
        [parentForm]="formGroup"
        label="seller.form.fullName"
        placeholder="seller.form.fullNamePlaceholder"
      ></app-input-field>

      <app-input-field
        controlName="email"
        [parentForm]="formGroup"
        label="seller.form.email"
        placeholder="seller.form.emailPlaceholder"
      ></app-input-field>
    }
  </app-form-layout>

  @if (!isCreateMode()) {
    <app-form-layout title="seller.form.section.permissions" [index]="2">
      <app-seller-access
        [resources]="permissionResources()"
        [role]="role()"
        [permissions]="permissions()"
        (roleChange)="onRoleChange($event)"
        (permissionsChange)="onPermissionsChange($event)"
      ></app-seller-access>
    </app-form-layout>
  }

  <div class="seller-form__footer">
    <app-button
      label="seller.form.cancel"
      severity="secondary"
      (onClick)="onClose()"
    ></app-button>

    <app-button
      [label]="
        isCreateMode() ? 'seller.form.createSubmit' : 'seller.form.submit'
      "
      [disabled]="formGroup.invalid"
      (onClick)="onSubmit()"
    ></app-button>
  </div>
</form>
