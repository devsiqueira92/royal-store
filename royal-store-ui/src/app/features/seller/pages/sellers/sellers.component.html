<div class="sellers-page">
  <h1 class="page-title">{{ 'seller.title' | translate }}</h1>

  <p-table [value]="sellers()" [loading]="isLoading()" dataKey="id">
    <ng-template #header>
      <tr>
        <th>{{ 'seller.columns.fullName' | translate }}</th>
      </tr>
    </ng-template>
    <ng-template #body let-seller>
      <tr>
        <td>{{ seller.fullName }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td>{{ 'seller.empty' | translate }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
