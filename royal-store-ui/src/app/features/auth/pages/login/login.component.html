<app-auth-shell>
  <!-- `ngSubmit` on the form, `type="submit"` on the button: Enter in either
       field now signs in, which is how people actually use a login form. -->
  <form id="login-form" class="auth-form" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <header class="auth-form__header">
      <h1 class="auth-form__title">{{ 'auth.title' | translate }}</h1>
      <p class="auth-form__subtitle">{{ 'auth.subtitle' | translate }}</p>
    </header>

    @if (error$ | async; as error) {
      <!-- role="alert" so the failure is announced, not only shown. -->
      <p-message severity="error" styleClass="auth-form__error" role="alert">
        {{ error }}
      </p-message>
    }

    <app-input-field
      [parentForm]="formGroup"
      controlName="email"
      type="email"
      autocomplete="username"
      [label]="'auth.email'"
    />

    <div class="auth-form__password">
      <app-password-field
        [parentForm]="formGroup"
        controlName="password"
        autocomplete="current-password"
        [label]="'auth.password'"
      />

      <app-link class="auth-form__forgot" routerLink="/auth/forgot-password">
        {{ 'auth.button.forgotPassword' | translate }}
      </app-link>
    </div>

    <app-button
      class="auth-form__submit"
      type="submit"
      severity="primary"
      label="auth.button.signIn"
      [loading]="(isLoading$ | async)!"
      [disabled]="(isLoading$ | async)!"
    />

    <p-divider align="center" type="solid">
      <span class="auth-form__divider-text">{{ 'or' | translate }}</span>
    </p-divider>

    <p class="auth-form__hint">
      {{ 'auth.newToRoyalStore' | translate }}
      <app-link routerLink="/auth/register">
        {{ 'auth.button.createAccount' | translate }}
      </app-link>
    </p>
  </form>
</app-auth-shell>
