<app-auth-shell>
  <form id="register-form" class="auth-form" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <header class="auth-form__header">
      <h1 class="auth-form__title">{{ 'auth.register.title' | translate }}</h1>
      <p class="auth-form__subtitle">{{ 'auth.register.subtitle' | translate }}</p>
    </header>

    @if (registerError$ | async; as error) {
      <p-message severity="error" styleClass="auth-form__error" role="alert">
        {{ error }}
      </p-message>
    }

    <app-input-field
      [parentForm]="formGroup"
      controlName="storeName"
      autocomplete="organization"
      [label]="'auth.storeName'"
    />

    <app-input-field
      [parentForm]="formGroup"
      controlName="email"
      type="email"
      autocomplete="username"
      [label]="'auth.email'"
    />

    <fieldset class="auth-form__fieldset">
      <legend class="auth-form__legend">{{ 'auth.documentType' | translate }}</legend>
      <p-selectbutton
        formControlName="documentType"
        [options]="documentTypeOptions"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
      />
    </fieldset>

    <app-input-field
      [parentForm]="formGroup"
      controlName="document"
      inputmode="numeric"
      [label]="'auth.document'"
    />

    <!-- `new-password` on both fields lets a password manager offer to
         generate and then save the credential. -->
    <app-password-field
      [parentForm]="formGroup"
      controlName="password"
      autocomplete="new-password"
      [label]="'auth.password'"
    />

    <app-password-field
      [parentForm]="formGroup"
      controlName="confirmPassword"
      autocomplete="new-password"
      [label]="'auth.confirmPassword'"
    />

    <app-button
      class="auth-form__submit"
      type="submit"
      severity="primary"
      label="auth.button.createAccount"
      [loading]="(isLoading$ | async)!"
      [disabled]="(isLoading$ | async)!"
    />

    <p class="auth-form__hint">
      {{ 'auth.alreadyHaveAccount' | translate }}
      <app-link routerLink="/auth/login">
        {{ 'auth.button.signIn' | translate }}
      </app-link>
    </p>
  </form>
</app-auth-shell>
