@if (cashShift(); as shift) {
  <section class="cash-shift-details">
    <header class="cash-shift-details__header">
      <div>
        <h1 class="cash-shift-details__title">
          {{ 'cashShift.page.title' | translate }}
        </h1>
        <p class="cash-shift-details__subtitle">
          {{ 'cashShift.page.subtitle' | translate }}
        </p>
      </div>

      <div class="cash-shift-details__meta">
        <span
          class="cash-shift-details__badge"
          [class.cash-shift-details__badge--closed]="!isOpen()"
          >{{
            (isOpen()
              ? 'cashShift.page.shiftOpen'
              : 'cashShift.page.shiftClosed'
            ) | translate
          }}</span
        >
        <span class="cash-shift-details__reference">{{ shiftMeta }}</span>
      </div>
    </header>

    <app-cash-shift-summary [cashShift]="shift"></app-cash-shift-summary>

    <div class="cash-shift-details__grid">
      <div class="cash-shift-details__column">
        <app-cash-movement-form></app-cash-movement-form>

        <app-cash-movement-list></app-cash-movement-list>
      </div>

      <app-close-shift-form
        [cashShift]="shift"
        [isClosing]="isClosing()"
        (confirmed)="closeShift($event)"
      ></app-close-shift-form>
    </div>
  </section>
}
