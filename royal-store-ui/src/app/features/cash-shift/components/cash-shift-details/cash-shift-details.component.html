@if (cashShift(); as shift) {
  <app-detail-layout
    [router]="['/cash-shift']"
    title="cashShift.page.title"
    subtitle="cashShift.page.subtitle"
    backText="cashShift.page.back"
  >
    <div actions-panel class="cash-shift-details__meta">
      <span
        class="cash-shift-details__badge"
        [class.cash-shift-details__badge--closed]="!isOpen()"
        >{{
          (isOpen() ? 'cashShift.page.shiftOpen' : 'cashShift.page.shiftClosed')
            | translate
        }}</span
      >
      <span class="cash-shift-details__reference">{{ shiftMeta() }}</span>
    </div>
    <app-cash-shift-summary [cashShift]="shift"></app-cash-shift-summary>

    <div class="cash-shift-details__grid">
      <div class="cash-shift-details__column">
        @if (editableShift()) {
          <app-cash-movement-form></app-cash-movement-form>
        }

        <app-cash-movement-list
          [movements]="shiftMovements()"
        ></app-cash-movement-list>
      </div>

      <app-close-shift-form
        [isOpenShift]="isOpen()"
        [cashShift]="shiftData()"
        [isClosing]="isClosing()"
        [canPerformAction]="editableShift() !== null"
        (confirmed)="closeShift($event)"
      ></app-close-shift-form>
    </div>
  </app-detail-layout>
}
