@if (cashShift(); as shift) {
  <section class="close-cash-shift">
    <header class="close-cash-shift__header">
      <div>
        <h1 class="close-cash-shift__title">
          {{ 'cashShift.page.title' | translate }}
        </h1>
        <p class="close-cash-shift__subtitle">
          {{ 'cashShift.page.subtitle' | translate }}
        </p>
      </div>

      <div class="close-cash-shift__meta">
        <span
          class="close-cash-shift__badge"
          [class.close-cash-shift__badge--closed]="!isOpen()"
          >{{
            (isOpen()
              ? 'cashShift.page.shiftOpen'
              : 'cashShift.page.shiftClosed'
            ) | translate
          }}</span
        >
        <span class="close-cash-shift__reference"
          >{{ shiftMeta.code }} · {{ shiftMeta.register }}</span
        >
      </div>
    </header>

    <app-cash-shift-summary [cashShift]="shift"></app-cash-shift-summary>

    <div class="close-cash-shift__grid">
      <div class="close-cash-shift__column">
        <app-cash-movement-form
          (submitted)="registerMovement($event)"
        ></app-cash-movement-form>

        <app-cash-movement-list
          [movements]="movements()"
        ></app-cash-movement-list>
      </div>

      <app-close-shift-form
        [cashShift]="shift"
        [isClosing]="isClosing()"
        (confirmed)="closeShift($event)"
      ></app-close-shift-form>
    </div>
  </section>
}
