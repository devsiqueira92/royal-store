<div class="payment-panel">
  <app-payment-method-list
    [methods]="methods()"
    [selected]="method()"
    [base]="base()"
    [labelledBy]="labelledBy()"
    (methodSelected)="selectMethod($event)"
  />

  @if (selectedOption()?.isCash) {
    <app-cash-payment-form
      [control]="form.controls.cashReceived"
      [total]="total()"
    />
  }

  @if (selectedOption()?.cardType; as cardType) {
    <app-card-payment-form
      [form]="form.controls.card"
      [showInstallments]="cardType === 'credit'"
      [total]="total()"
    />
  }
</div>
