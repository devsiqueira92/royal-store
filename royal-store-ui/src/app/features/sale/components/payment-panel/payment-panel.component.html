<div class="payment-panel">
  <app-payment-method-list
    [methods]="methods()"
    [selected]="method()"
    [base]="base()"
    (methodSelected)="selectMethod($event)"
  />

  @if (selectedOption(); as option) {
    @if (option.cardType) {
      <app-card-payment-form
        [form]="form.controls.card"
        [showInstallments]="option.cardType === 'credit'"
      />
    }
    @if (option.isSplit) {
      <app-split-payment-form
        [form]="form.controls.splits"
        [methods]="splitMethods()"
        [remaining]="remaining()"
        (addPayment)="addSplit()"
        (removePayment)="removeSplit($event)"
      />
    }
  }
</div>
