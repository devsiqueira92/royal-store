<div class="summary">
  <div class="summary__row">
    <span class="summary__label">{{
      'sale.current.subtotal' | translate
    }}</span>
    <span class="summary__value">{{ subtotal() | currency }}</span>
  </div>

  <div class="summary__row summary__row--tax">
    <span class="summary__label">
      {{
        'sale.current.tax'
          | translate: { rate: (taxPercent() | number: '1.0-2') }
      }}
    </span>
    <span class="summary__value summary__value--info">{{
      tax() | currency
    }}</span>
  </div>

  <div class="summary__row summary__row--total">
    <span class="summary__label">{{ 'sale.current.total' | translate }}</span>
    <span class="summary__total">{{ total() | currency }}</span>
  </div>
</div>
