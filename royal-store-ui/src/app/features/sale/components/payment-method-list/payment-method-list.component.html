<div class="methods">
  @for (option of methods(); track option.id) {
    <button
      type="button"
      class="methods__row"
      [class.methods__row--selected]="selected() === option.id"
      (click)="methodSelected.emit(option.id)"
    >
      <span class="methods__icon"><i [class]="option.icon"></i></span>

      <span class="methods__info">
        <strong>
          {{ option.labelIsKey ? (option.label | translate) : option.label }}
        </strong>
      </span>

      @if (option.discount > 0) {
        <span class="methods__discount">
          <strong>−{{ option.discount }}%</strong>
          <span>−{{ discountAmount(option.discount) | currency }}</span>
        </span>
      }

      @if (selected() === option.id) {
        <i class="pi pi-check methods__check"></i>
      }
    </button>
  }
</div>
