<p-dialog
  styleClass="checkout-dialog"
  [visible]="open()"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  [style]="{ width: '32rem', maxWidth: '95vw' }"
  (visibleChange)="$event || close()"
>
  <ng-template #header>
    <div class="checkout-dialog__title">
      <span>{{ 'sale.checkout.eyebrow' | translate }}</span>
      <h2>{{ steps[step() - 1].title | translate }}</h2>
    </div>
  </ng-template>

  <app-checkout-steps [steps]="steps" [current]="step()" />

  <!-- Panels stay mounted so stepping back and forth never drops what was typed. -->
  <div class="checkout-dialog__body">
    <app-customer-step
      [class.checkout-dialog__panel--hidden]="step() !== 1"
      [customers]="filteredCustomers()"
      [search]="search"
      [selectedId]="customerId()"
      (customerSelected)="selectCustomer($event)"
    />

    <app-payment-step
      [class.checkout-dialog__panel--hidden]="step() !== 2"
      [customer]="selectedCustomer()"
      [loyaltyRate]="totals().loyaltyRate"
      [cashbackBalance]="cashbackBalance()"
      [useCashback]="useCashback()"
      [total]="totals().total"
      [base]="totals().base"
      (cashbackToggled)="toggleCashback($event)"
      (paymentChange)="payment.set($event)"
    />

    <app-fulfillment-step
      [class.checkout-dialog__panel--hidden]="step() !== 3"
      [fulfillmentForm]="form.controls.fulfillment"
      [hasCustomer]="!!customerId()"
      [addresses]="customerAddresses()"
    />

    @if (step() === 4 && receiptSaleId(); as saleId) {
      <app-fiscal-receipt-preview
        [saleId]="saleId"
        (closed)="close()"
      />
    }
  </div>

  <ng-template #footer>
    @if (step() !== 4) {
      <div class="checkout-dialog__footer">
        <app-checkout-summary [totals]="totals()" />

        <div class="checkout-dialog__actions">
          <p-button
            severity="secondary"
            [outlined]="true"
            [label]="
              (step() === 1 ? 'sale.checkout.cancel' : 'sale.checkout.back')
                | translate
            "
            [disabled]="awaitingResult()"
            (onClick)="step() === 1 ? close() : back()"
          />

          @if (step() === 3) {
            <p-button
              icon="pi pi-check"
              iconPos="right"
              [label]="'sale.checkout.confirm' | translate"
              [loading]="awaitingResult()"
              [disabled]="!canAdvance()"
              (onClick)="confirm()"
            />
          } @else {
            <p-button
              icon="pi pi-arrow-right"
              iconPos="right"
              [label]="'sale.checkout.next' | translate"
              [disabled]="!canAdvance()"
              (onClick)="next()"
            />
          }
        </div>
      </div>
    }
  </ng-template>
</p-dialog>
