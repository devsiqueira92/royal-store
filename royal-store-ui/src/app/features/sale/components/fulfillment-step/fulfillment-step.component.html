<div class="fulfillment-step">
  <p class="fulfillment-step__hint">
    {{
      (hasCustomer()
        ? 'sale.checkout.fulfillment.customerHint'
        : 'sale.checkout.fulfillment.manualHint'
      ) | translate
    }}
  </p>

  @if (hasCustomer()) {
    <app-select-field
      controlName="customerAddressId"
      [parentForm]="fulfillmentForm()"
      label="sale.checkout.fulfillment.customerAddress"
      [options]="addressOptions()"
      [showClear]="true"
    ></app-select-field>
  }

  <div class="form__row form__row--2">
    <app-input-field
      controlName="zipCode"
      [parentForm]="fulfillmentForm().controls.address"
      label="sale.checkout.fulfillment.zipCode"
    ></app-input-field>

    <app-input-field
      controlName="city"
      [parentForm]="fulfillmentForm().controls.address"
      label="sale.checkout.fulfillment.city"
    ></app-input-field>
  </div>

  <div class="form__row form__row--2">
    <app-input-field
      controlName="street"
      [parentForm]="fulfillmentForm().controls.address"
      label="sale.checkout.fulfillment.street"
    ></app-input-field>

    <app-input-field
      controlName="number"
      [parentForm]="fulfillmentForm().controls.address"
      label="sale.checkout.fulfillment.number"
    ></app-input-field>
  </div>
</div>
