<div class="split-payment">
  @for (row of form().controls; track row; let index = $index) {
    <div class="split-payment__row" [formGroup]="row">
      <p-select
        class="split-payment__method"
        formControlName="method"
        [options]="methods()"
        optionLabel="label"
        optionValue="id"
        appendTo="body"
      />

      <p-inputnumber
        class="split-payment__amount"
        formControlName="amount"
        mode="decimal"
        [min]="0"
        [minFractionDigits]="2"
        [maxFractionDigits]="2"
        [invalid]="row.controls.amount.touched && row.controls.amount.invalid"
        [inputStyle]="{ width: '100%', textAlign: 'right' }"
      />

      <button
        type="button"
        class="split-payment__remove"
        [attr.aria-label]="'sale.current.payment.removePayment' | translate"
        [disabled]="form().length === 1"
        (click)="removePayment.emit(index)"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>
  }

  <button type="button" class="split-payment__add" (click)="addPayment.emit()">
    {{ 'sale.current.payment.addPayment' | translate }}
  </button>

  <div
    class="split-payment__remaining"
    [class.split-payment__remaining--pending]="remaining() > 0"
    [class.split-payment__remaining--over]="remaining() < 0"
  >
    <span>
      {{
        (remaining() < 0
          ? 'sale.current.payment.overpaid'
          : 'sale.current.payment.remaining'
        ) | translate
      }}
    </span>
    <strong>{{
      (remaining() < 0 ? -remaining() : remaining()) | currency
    }}</strong>
  </div>
</div>
