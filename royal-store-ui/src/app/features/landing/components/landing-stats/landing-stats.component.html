<section class="stats" [attr.aria-label]="'landing.stats.title' | translate">
  <div class="stats__inner">
    <dl class="stats__list">
      @for (stat of stats(); track stat.id; let i = $index) {
        <div class="stats__item" appRevealOnScroll [revealDelay]="i * 70">
          <i [class]="'stats__icon ' + stat.icon" aria-hidden="true"></i>
          <dt class="stats__value">{{ stat.valueKey | translate }}</dt>
          <dd class="stats__label">{{ stat.labelKey | translate }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
