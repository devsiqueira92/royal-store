<label class="product-tags-field__label" for="product-tags">
  {{ label() | translate }}
</label>
<div class="product-tags-field__tags">
  @for (tag of selectedTags(); track tag.id) {
    <span class="product-tags-field__tag">
      <span
        class="product-tags-field__tag-dot"
        [style.background]="tag.color || getSwatchColor(tag.name)"
      ></span>
      {{ tag.name }}
      <button
        type="button"
        [attr.aria-label]="'product.form.removeTag' | translate"
        (click)="removeTag(tag.id)"
      >
        <i class="pi pi-times"></i>
      </button>
    </span>
  }
  <div class="product-tags-field__input">
    <input
      id="product-tags"
      type="text"
      [ngModel]="tagQuery()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="tagQuery.set($event)"
      (keydown)="onTagInputKeydown($event)"
      [placeholder]="'product.form.tagsPlaceholder' | translate"
    />
    @if (tagSuggestions().length > 0) {
      <ul class="product-tags-field__suggestions">
        @for (suggestion of tagSuggestions(); track suggestion.id) {
          <li>
            <button type="button" (click)="addTag(suggestion)">
              {{ suggestion.name }}
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
