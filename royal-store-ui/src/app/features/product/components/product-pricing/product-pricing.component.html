<app-form-layout
  title="product.form.section.pricing"
  headerDetails="product.form.section.pricingHint"
  icon="pi-dollar"
  [collapsedPanel]="false"
>
  <button
    icon-actions
    type="button"
    class="calculator-icon"
    [class.calculator-icon--active]="showPriceTable()"
    (click)="togglePriceTable()"
  >
    <i class="pi pi-calculator"></i>
  </button>

  <div class="form__row form__row--2">
    <app-input-number-field
      controlName="productCost"
      [parentForm]="localFormGroup"
      label="product.form.productCost"
      [min]="0"
      [step]="0.01"
      (blurred)="onProductCostBlur()"
    ></app-input-number-field>

    <app-select-field
      controlName="costCompositionId"
      [parentForm]="formGroup()"
      label="product.form.costComposition"
      [options]="costCompositionOptions()"
      [loading]="isLoadingCostCompositions()"
      [showClear]="true"
      [filter]="true"
      (onSelect)="onCostCompositionChange()"
    ></app-select-field>
  </div>

  <div class="form__row form__row--2">
    <app-input-number-field
      controlName="profitMarginPercent"
      [parentForm]="localFormGroup"
      label="product.form.profitMarginPercent"
      mode="percent"
      prefix=""
      suffix="%"
      [min]="-100"
      [step]="1"
      (blurred)="onProfitMarginBlur()"
    ></app-input-number-field>

    @if (!showPriceTable()) {
      <app-input-number-field
        controlName="basePrice"
        [parentForm]="formGroup()"
        label="product.form.price"
        (blurred)="onBasePriceBlur()"
      ></app-input-number-field>
    }
  </div>

  @if (showPriceTable()) {
    <app-product-price-table
      [costPrice]="basePrice()"
      [prices]="formGroup().controls.prices"
    />
  }

  <!-- Transforme essa seção em texto, adicione detalhes do basePrice +  -->
  <div class="form__row form__row--2">
    <app-input-number-field
      controlName="baseCostPrice"
      [parentForm]="formGroup()"
      label="product.form.cost"
    ></app-input-number-field>

    <app-input-number-field
      controlName="profitAmount"
      [parentForm]="localFormGroup"
      label="product.form.profit"
    ></app-input-number-field>
  </div>
</app-form-layout>
