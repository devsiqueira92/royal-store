<span class="item-type__label">{{
  'product.form.itemType.label' | translate
}}</span>
<div class="item-type__grid">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="item-type__card"
      [class.item-type__card--active]="value() === option.value"
      [class.item-type__card--disabled]="disabled()"
      [disabled]="disabled()"
      (click)="select(option.value)"
    >
      <p-radiobutton
        [name]="'itemType'"
        [value]="option.value"
        [ngModel]="value()"
        [inputId]="'itemType-' + option.value"
        [disabled]="disabled()"
        (ngModelChange)="select($event)"
      />
      <span class="item-type__text">
        <span class="item-type__title">{{ option.titleKey | translate }}</span>
        <span class="item-type__hint">{{
          option.subtitleKey | translate
        }}</span>
      </span>
    </button>
  }
</div>
