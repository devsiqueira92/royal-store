<div class="products-page__toolbar">
  <p-iconfield class="products-page__search">
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      type="text"
      [ngModel]="searchTerm()"
      (ngModelChange)="setSearchTerm($event)"
      [placeholder]="'product.filters.searchPlaceholder' | translate"
    />
  </p-iconfield>

  <p-select
    class="products-page__filter"
    [options]="categoryOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="categoryFilter()"
    (ngModelChange)="setCategoryFilter($event)"
  />

  <p-select
    class="products-page__filter"
    [options]="supplierOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="supplierFilter()"
    (ngModelChange)="setSupplierFilter($event)"
  />

  <span class="products-page__results">
    {{ 'product.filters.results' | translate: { count: resultsCount() } }}
  </span>
</div>
