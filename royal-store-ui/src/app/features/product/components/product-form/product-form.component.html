<form class="product-form" [formGroup]="formGroup">
  @if (selectedProduct() !== null) {
    <div class="product-form__active">
      <app-toggle-field
        [parentForm]="formGroup"
        controlName="isActive"
        titleKey="product.form.active"
        subtitleKey="product.form.activeHint"
      ></app-toggle-field>
    </div>
  }

  @if (!loading()) {
    <app-item-type-selector
      (valueChange)="onItemTypeChange($event)"
      [disabled]="selectedProduct() !== null"
    ></app-item-type-selector>

    <app-product-detail
      [formGroup]="formGroup"
      [variants]="variants"
    ></app-product-detail>

    <app-product-taxes
      [parentForm]="formGroup"
      [itemType]="itemType()"
      [templates]="taxTemplates()"
      [helperText]="taxHelperText()"
    ></app-product-taxes>

    <app-product-variants
      [formGroup]="formGroup"
      [variants]="variants"
      [itemType]="itemType()"
    ></app-product-variants>

    <app-product-logistics [formGroup]="formGroup"></app-product-logistics>
  }

  <app-product-footer
    [formGroup]="formGroup"
    [variants]="variants"
    [itemType]="itemType()"
  ></app-product-footer>
</form>
