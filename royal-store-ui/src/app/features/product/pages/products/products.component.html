<section class="products-page">
  <header class="products-page__header">
    <div>
      <h1 class="products-page__title">{{ 'product.title' | translate }}</h1>
      <p class="products-page__subtitle">
        {{
          'product.subtitle'
            | translate
              : {
                  count: totalProducts(),
                  categories: categoriesCount(),
                }
        }}
      </p>
    </div>
    <div class="products-page__header-actions">
      <p-button
        [label]="'product.labelPrint.title' | translate"
        icon="pi pi-tag"
        severity="secondary"
        [outlined]="true"
        [disabled]="selectedProducts().length === 0"
        routerLink="labels"
      />
      <p-button
        [label]="'product.newProduct' | translate"
        icon="pi pi-plus"
        (onClick)="createProduct()"
      />
    </div>
  </header>

  <app-product-stats />

  <div class="products-page__panel">
    <app-product-filters />
    <app-products-table />
  </div>
</section>
