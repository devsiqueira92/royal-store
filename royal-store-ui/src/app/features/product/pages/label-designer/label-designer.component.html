<p-confirmdialog [key]="labelTypeConfirmKey" />

<app-detail-layout
  [router]="['/products/labels/templates']"
  title="product.labelDesigner.title"
  subtitle="product.labelDesigner.subtitle"
  backText="product.labelPrint.back"
>
  <div class="label-designer-page__heading" actions-panel>
    <div>
      <h1 class="label-designer-page__title">
        {{
          (labelId
            ? 'product.labelDesigner.editTitle'
            : 'product.labelDesigner.title'
          ) | translate
        }}
      </h1>
      <p class="label-designer-page__subtitle">
        {{ 'product.labelDesigner.subtitle' | translate }}
      </p>
    </div>
    <app-button
      label="product.labelDesigner.save"
      icon="pi pi-save"
      [disabled]="!canSave()"
      [loading]="isSaving()"
      (onClick)="onSave()"
    ></app-button>
  </div>
  <div class="label-designer-page__layout">
    <aside class="label-designer-page__panel label-designer-page__panel--left">
      <app-label-format-panel
        [selectionForm]="selectionForm"
        [sheetForm]="sheetForm"
        [paperType]="paperType()"
      />
    </aside>

    <main class="label-designer-page__panel label-designer-page__center">
      <h2 class="label-designer-page__panel-title">
        {{ 'product.labelDesigner.editor.title' | translate }}
      </h2>
      <app-label-editor
        [labelWidth]="layout().spec.labelWidth"
        [labelHeight]="layout().spec.labelHeight"
        [elements]="elements()"
        [fieldOptions]="fieldOptions()"
        [sampleProduct]="sampleProduct()"
        (fieldToggled)="onFieldToggled($event)"
        (elementChanged)="onElementChanged($event)"
      />
    </main>

    <aside class="label-designer-page__panel label-designer-page__panel--right">
      <h2 class="label-designer-page__panel-title">
        {{ 'product.labelDesigner.preview.title' | translate }}
      </h2>
      <app-label-sheet-preview [layout]="layout()" />
    </aside>
  </div>
</app-detail-layout>
